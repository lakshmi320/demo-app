name: CI/CD to EC2 (K8s, SHA tagging)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      ###############################################
      # 2) SONARQUBE ANALYSIS (Java 21 + Maven)
      ###############################################

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # Build Maven FIRST so that demo-app/target/ exists for Sonar
      - name: Build with Maven (demo-app)
        working-directory: demo-app
        run: mvn clean install -DskipTests

      - name: Cache SonarQube packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # >>> FIX: keep files where they are; pass properties via args
      - name: SonarQube Scan (root properties, code in demo-app)
        uses: SonarSource/sonarqube-scan-action@v2
        with:
          projectBaseDir: .     # properties file is at repo root
          args: >
            -Dsonar.projectKey=demo-app
            -Dsonar.projectName=demo-app
            -Dsonar.sources=demo-app/src
            -Dsonar.java.binaries=demo-app/target
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}   # e.g., http://98.84.183.113:9000
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}         # token from SonarQube UI

      ###############################################
      # 3) CONTAINERIZE & PUSH
      ###############################################

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image (SHA + latest)
        run: |
          docker build -f demo-app/Dockerfile -t ${{ secrets.DOCKER_REPO }}:${{ github.sha }} demo-app
          docker tag  ${{ secrets.DOCKER_REPO }}:${{ github.sha }} ${{ secrets.DOCKER_REPO }}:latest

      - name: Push Docker image (SHA + latest)
        run: |
          docker push ${{ secrets.DOCKER_REPO }}:${{ github.sha }}
          docker push ${{ secrets.DOCKER_REPO }}:latest

      ###############################################
      # 4) DEPLOY TO EC2 MINIKUBE OVER SSH
      ###############################################

      - name: Deploy to EC2 Minikube (update image to SHA, apply, rollout)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}         # EC2 public IP
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}       # private key content
          script: |
            set -e
            # Ensure kubectl points to minikube
            kubectl config use-context minikube || true

            echo "🔧 Updating image in ~/deployment.yaml to SHA: ${{ github.sha }}"
            sed -i "s#^\(\s*image:\s*\).*#\1${{ secrets.DOCKER_REPO }}:${{ github.sha }}#g" ~/deployment.yaml

            echo "📦 Applying deployment.yaml"
            kubectl apply -f ~/deployment.yaml

            echo "🔁 Rolling out deployment demo-app-deployment"
            kubectl rollout restart deployment demo-app-deployment

            echo "⏳ Waiting for rollout to finish…"
            kubectl rollout status deployment/demo-app-deployment --timeout=180s

            echo "🔍 Final image version on cluster:"
            kubectl get deploy demo-app-deployment -o jsonpath='{.spec.template.spec.containers[0].image}'; echo
